<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>笔画小剧场</title>
    <link rel="icon" href="../assets/hanzi-mark.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/hanzi-mark-180.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="grid.css" />
    <link rel="stylesheet" href="steps.css" />
    <link rel="stylesheet" href="topbar.css" />
    <link rel="stylesheet" href="offline.css" />
    <link rel="stylesheet" href="input.css" />
    <link rel="stylesheet" href="dictionary.css" />
    <link rel="stylesheet" href="lookup.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <main class="app">
      <div class="topbar"><button id="install-app" type="button" hidden>＋ 添加到主屏幕</button></div>
      <header><p class="eyebrow">HANZI STROKE SHOW</p><h1>笔画小剧场</h1></header>
      <form id="word-form" class="word-form"><div class="input-row"><input id="word-input" aria-label="输入汉字" placeholder="输入汉字" maxlength="12" autocomplete="off" inputmode="text" /><button type="submit">演示</button><button id="lookup-toggle" class="lookup-toggle" type="button" aria-haspopup="dialog" aria-controls="lookup-modal">查字典</button></div></form>
      <div id="lookup-modal" class="lookup-modal" hidden role="dialog" aria-modal="true" aria-labelledby="lookup-title"><button id="lookup-backdrop" class="lookup-backdrop" type="button" aria-label="关闭查字典"></button><section id="lookup-sheet" class="lookup-sheet"><div class="lookup-heading"><div><p class="eyebrow">DICTIONARY LOOKUP</p><h2 id="lookup-title">查字典</h2></div><button id="lookup-close" class="lookup-close" type="button" aria-label="关闭">×</button></div><div id="lookup-selection"><p class="lookup-hint">不用输入汉字</p><div class="lookup-tabs" role="tablist" aria-label="查字方式"><button class="active" type="button" role="tab" aria-selected="true" data-lookup-mode="pinyin">拼音查字</button><button type="button" role="tab" aria-selected="false" data-lookup-mode="radicals">部首查字</button><button type="button" role="tab" aria-selected="false" data-lookup-mode="strokes">笔画查字</button></div><div id="lookup-pinyin" class="lookup-method"><div class="lookup-input-row"><input id="lookup-pinyin-input" type="search" inputmode="latin" autocomplete="off" placeholder="例如：han、xue、yong" aria-label="输入拼音" /><button id="lookup-pinyin-submit" type="button">查找</button></div></div><div id="lookup-radicals" class="lookup-method" hidden><div id="lookup-radicals-list" class="lookup-choice-list" aria-label="选择部首"></div></div><div id="lookup-strokes" class="lookup-method" hidden><div id="lookup-strokes-list" class="lookup-choice-list lookup-stroke-list" aria-label="选择笔画数"></div></div></div><div id="lookup-result-view" hidden><div class="lookup-result-heading"><button id="lookup-result-back" type="button">← 返回</button><h3 id="lookup-result-title"></h3></div><div id="lookup-result-filters" class="lookup-initials" hidden aria-label="按声母筛选"></div><p id="lookup-status" class="lookup-status" aria-live="polite"></p><div id="lookup-results" class="lookup-results" aria-live="polite"></div></div></section></div>
      <section class="stage" aria-labelledby="stage-title"><div class="stage-heading"><div><h2 id="stage-title">你好</h2></div><p id="progress" aria-live="polite">第 1 / 2 个字</p></div><div class="stroke-guide"><div id="stroke-steps" class="stroke-steps"></div></div><div id="character-card" class="character-card" aria-label="汉字笔画动画"></div><p id="status" class="status" aria-live="polite"></p><div class="controls"><button id="previous" class="secondary" type="button">← 上一个</button><button id="replay" type="button">↻ 再看一遍</button><button id="next" class="secondary" type="button">下一个 →</button></div><div class="practice-row"><button id="practice" type="button" hidden>✎ 开始书写</button></div></section>
      <section id="dictionary-card" class="dictionary-card" aria-labelledby="dictionary-title" aria-live="polite"><div class="dictionary-heading"><div><p class="eyebrow">KNOW THE CHARACTER</p><h2 id="dictionary-title">汉字解析</h2></div><span id="dictionary-character" aria-hidden="true">—</span></div><p id="dictionary-loading" class="dictionary-loading">输入汉字后查看释义与组词。</p><div id="dictionary-content" hidden><p id="dictionary-pinyin" class="dictionary-pinyin"></p><p id="dictionary-meta" class="dictionary-meta"></p><div class="dictionary-definition"><h3>字义</h3><p id="dictionary-meaning"></p></div><div class="dictionary-words"><h3>组词</h3><div id="dictionary-word-list"></div></div></div><p class="dictionary-source">释义与组词：chinese-xinhua（MIT License）</p></section>
      <section class="offline-library" aria-labelledby="offline-title"><div><h2 id="offline-title">完整离线字库 <small>覆盖 9,574 个汉字</small></h2><p id="offline-status">需要时下载完整字库，之后断网也能使用所有汉字。</p></div><button id="download-library" type="button">下载离线字库</button><progress id="offline-progress" max="100" value="0" hidden></progress></section>
    </main>
    <script src="vendor/hanzi-writer.min.js"></script><script src="data-index.js"></script><script src="data-library-version.js"></script><script src="lookup-index.js"></script><script src="steps.js"></script><script src="install.js"></script><script src="dictionary.js"></script><script src="lookup.js"></script><script src="app.js"></script><script src="offline.js?v=8"></script>
  </body>
</html>

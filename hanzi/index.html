<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ed" />
    <title>笔画小剧场</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <a class="back" href="../entrance/">← 回到小游戏乐园</a>
      <header><p class="eyebrow">HANZI STROKE SHOW</p><h1>笔画小剧场</h1><p class="intro">输入汉字，看每一笔依次出现。</p></header>
      <form id="word-form" class="word-form"><label for="word-input">想看的汉字</label><div class="input-row"><input id="word-input" value="你好" maxlength="12" autocomplete="off" inputmode="text" aria-describedby="input-help" /><button type="submit">开始演示</button></div><p id="input-help">Demo 内置 23 个常用字：你、好、永、学、汉、字、笔、画、演、示、中国等。</p></form>
      <section class="stage" aria-labelledby="stage-title"><div class="stage-heading"><div><p class="eyebrow">NOW SHOWING</p><h2 id="stage-title">你好</h2></div><p id="progress" aria-live="polite">第 1 / 2 个字</p></div><div id="character-card" class="character-card" aria-label="汉字笔画动画"></div><p id="status" class="status" aria-live="polite"></p><div class="controls"><button id="previous" class="secondary" type="button">← 上一个</button><button id="replay" type="button">↻ 再看一遍</button><button id="next" class="secondary" type="button">下一个 →</button></div></section>
      <section class="suggestions" aria-labelledby="suggestions-title"><h2 id="suggestions-title">试试这些</h2><div class="chips"><button type="button" data-word="你好">你好</button><button type="button" data-word="中国">中国</button><button type="button" data-word="汉字">汉字</button><button type="button" data-word="笔画演示">笔画演示</button><button type="button" data-word="我爱学习">我爱学习</button></div></section>
    </main>
    <script src="vendor/hanzi-writer.min.js"></script><script src="app.js"></script>
  </body>
</html>

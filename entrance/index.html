<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8ff" />
    <title>小游戏乐园</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hub">
      <header class="hero">
        <img src="../assets/minigame-mark.svg" alt="小游戏乐园" />
        <p>MINI GAME ARCADE</p>
        <h1>小游戏乐园</h1>
        <span>挑一款，开始玩吧</span>
      </header>

      <section class="game-list" aria-label="游戏列表">
        <a class="game-card math" href="../times/">
          <img class="card-art" src="../assets/times-mark.svg" alt="" />
          <div class="card-copy"><p>学习游戏</p><h2>九九星球</h2><span>在练习中记住九九乘法表</span></div>
        </a>

        <a class="game-card pterosaur" href="../pterosaur/">
          <img class="card-art" src="../assets/pterosaur-mark.svg" alt="" />
          <div class="card-copy"><p>积木档案</p><h2>机械翼龙战车</h2><span>在 3D 中探索机械翼龙与战车</span></div>
        </a>
      </section>
    </main>
  </body>
</html>
